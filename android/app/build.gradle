plugins {
    id 'com.android.application'
}

android {
    namespace 'com.velox.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.velox.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        velox {
            storeFile file('../ci.keystore')
            storePassword 'android'
            keyAlias 'velox'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.velox
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
