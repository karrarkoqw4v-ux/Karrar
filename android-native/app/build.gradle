plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'io.github.takahirom.roborazzi'
}
android {
    namespace 'com.turbo.rashq'
    compileSdk 34
    defaultConfig {
        applicationId 'com.turbo.rashq'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('KS_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KS_PASS')
                keyAlias 'turbo'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KS_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    testOptions { unitTests { includeAndroidResources = true; all { jvmArgs '-Xmx3g' } } }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'
    implementation 'io.coil-kt:coil-svg:2.7.0'
    implementation 'com.airbnb.android:lottie-compose:6.6.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.32.2'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.32.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
