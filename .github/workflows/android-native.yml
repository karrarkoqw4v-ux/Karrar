name: Build Native APK (Turbo Rashq)

on:
  workflow_dispatch:
  push:
    branches: [ccr-a3115199-ehhgzi]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Restore signing key
        id: ks
        uses: actions/cache@v4
        with:
          path: android-native/ci.keystore
          key: turbo-keystore-v1
      - name: Create signing key (first build only)
        if: steps.ks.outputs.cache-hit != 'true'
        working-directory: android-native
        run: keytool -genkeypair -keystore ci.keystore -alias turbo -storepass turbo-ci-pass -keypass turbo-ci-pass -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Turbo Rashq,O=Turbo,C=IQ"
      - name: Build release APK
        working-directory: android-native
        env:
          KS_FILE: ${{ github.workspace }}/android-native/ci.keystore
          KS_PASS: turbo-ci-pass
        run: gradle --no-daemon assembleRelease
      - name: Collect APK
        run: |
          mkdir -p android-native/dist
          cp android-native/app/build/outputs/apk/release/app-release.apk android-native/dist/TurboRashq.apk
      - uses: actions/upload-artifact@v4
        with: { name: turbo-apk, path: android-native/dist/TurboRashq.apk }
      - name: Commit APK
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -f android-native/dist/TurboRashq.apk
          git commit -m "Build Turbo Rashq APK" || echo none
          git pull --rebase origin ${{ github.ref_name }} && git push

  shots:
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build debug APK
        working-directory: android-native
        run: gradle --no-daemon assembleDebug
      - name: Screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android-native/shots.sh
      - uses: actions/upload-artifact@v4
        with: { name: turbo-shots, path: shots-out/*.png }
      - name: Commit screenshots
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          mkdir -p android-native/shots-out && cp shots-out/*.png android-native/shots-out/
          git add -f android-native/shots-out
          git commit -m "Native screenshots" || echo none
          git pull --rebase origin ${{ github.ref_name }} && git push
