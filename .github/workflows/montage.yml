name: Build Montage APK (مونتاج مرتاح)

on:
  workflow_dispatch:
  push:
    branches: [ccr-a3115199-ehhgzi]
    paths:
      - 'montage/**'
      - '.github/workflows/montage.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: montage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.50.0', channel: stable, cache: true }
      - name: Restore signing key (keeps updates installable)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: montage-debug-keystore-v1
      - name: Generate android project
        run: |
          flutter create --platforms=android --org com.montage --project-name montage_murtaah .
          rm -rf test
          python3 ci/patch.py .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64
      - name: Collect
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Montage.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: montage-apk, path: montage/dist/Montage.apk }
      - name: Publish release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete montage-latest -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create montage-latest dist/Montage.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "مونتاج مرتاح (آخر نسخة)" --notes "APK لتطبيق مونتاج مرتاح - يتحدّث مع كل بناء"
