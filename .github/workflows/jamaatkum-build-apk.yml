name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_host:
        description: "عنوان السيرفر (مثال: http://192.168.1.10:8080 أو https://api.example.com)"
        required: true
        default: "http://10.0.2.2:8080"
  push:
    branches: [ccr-6b7e7377-qadw3u]
    paths: ["jamaatkum/app/**", ".github/workflows/jamaatkum-build-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: jamaatkum/app
        run: flutter create --platforms=android --org com.jamaatkum --project-name jamaatkum .

      - name: Patch AndroidManifest (internet, http, crop screen, app name)
        working-directory: jamaatkum/app
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if "POST_NOTIFICATIONS" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application', 1)
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="jamaatkum"', 'android:label="جماعتكم"')
          crop = '<activity android:name="com.yalantis.ucrop.UCropActivity" android:screenOrientation="portrait" android:theme="@style/Theme.AppCompat.Light.NoActionBar"/>'
          if "UCropActivity" not in s:
              s = s.replace("</application>", "    " + crop + "\n    </application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml

      - name: Enable core library desugaring (required by flutter_local_notifications)
        working-directory: jamaatkum/app
        run: |
          python3 - <<'PY'
          import re

          kts = "android/app/build.gradle.kts"
          groovy = "android/app/build.gradle"
          path = kts if __import__("os").path.exists(kts) else groovy
          s = open(path, encoding="utf-8").read()
          is_kts = path.endswith(".kts")

          if "isCoreLibraryDesugaringEnabled" not in s and "coreLibraryDesugaringEnabled" not in s:
              if is_kts:
                  s = re.sub(
                      r"(compileOptions\s*\{)",
                      r"\1\n        isCoreLibraryDesugaringEnabled = true",
                      s, count=1,
                  )
              else:
                  s = re.sub(
                      r"(compileOptions\s*\{)",
                      r"\1\n        coreLibraryDesugaringEnabled true",
                      s, count=1,
                  )

          if "desugar_jdk_libs" not in s:
              dep = (
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  if is_kts else
                  '    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n'
              )
              if "dependencies {" in s:
                  s = s.replace("dependencies {", "dependencies {\n" + dep, 1)
              else:
                  s += "\ndependencies {\n" + dep + "}\n"

          # Android Lint's "lintVitalRelease" task crashes on this toolchain
          # (unrelated NoSuchMethodError inside the bundled lint checker, not
          # our code) — skip lint on release builds so it can't block the APK.
          if "checkReleaseBuilds" not in s:
              lint_block = (
                  '    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n'
                  if is_kts else
                  '    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n'
              )
              s = re.sub(r"(android\s*\{)", r"\1\n" + lint_block, s, count=1)

          open(path, "w", encoding="utf-8").write(s)
          print(f"patched {path}")
          PY
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle

      - name: Build release APK
        working-directory: jamaatkum/app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_HOST=${{ github.event.inputs.api_host || 'http://10.0.2.2:8080' }}

      - uses: actions/upload-artifact@v4
        with:
          name: jamaatkum-apk
          path: jamaatkum/app/build/app/outputs/flutter-apk/app-release.apk
