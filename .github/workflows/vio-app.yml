name: Build Native APK (Vio Studio)

on:
  workflow_dispatch:
  push:
    branches: [ccr-a3115199-ehhgzi]
    paths:
      - 'vio-app/**'
      - '.github/workflows/vio-app.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Restore signing key
        id: ks
        uses: actions/cache@v4
        with:
          path: vio-app/ci.keystore
          key: vio-keystore-v1
      - name: Create signing key (first build only)
        if: steps.ks.outputs.cache-hit != 'true'
        working-directory: vio-app
        run: keytool -genkeypair -keystore ci.keystore -alias vio -storepass vio-ci-pass -keypass vio-ci-pass -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Vio Studio,O=Vio,C=IQ"
      - name: Build release APK
        working-directory: vio-app
        env:
          KS_FILE: ${{ github.workspace }}/vio-app/ci.keystore
          KS_PASS: vio-ci-pass
        run: gradle --no-daemon assembleRelease
      - name: Collect APK
        run: |
          mkdir -p vio-app/dist
          cp vio-app/app/build/outputs/apk/release/app-release.apk vio-app/dist/VioStudio.apk
      - uses: actions/upload-artifact@v4
        with: { name: vio-apk, path: vio-app/dist/VioStudio.apk }
      - name: Commit APK
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -f vio-app/dist/VioStudio.apk
          git commit -m "Build Vio Studio APK" || echo none
          git pull --rebase -X theirs origin ${{ github.ref_name }} && git push

  shots-jvm:
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Render real screens on the JVM (Robolectric)
        working-directory: vio-app
        timeout-minutes: 25
        continue-on-error: true
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Test diagnostics
        if: always()
        run: |
          ls -la vio-app/app/build/shots-jvm 2>&1 | head -40
          grep -h -m3 -A25 '<failure' vio-app/app/build/test-results/testDebugUnitTest/*.xml 2>&1 | cut -c1-300 | head -80
          grep -h -c 'testcase' vio-app/app/build/test-results/testDebugUnitTest/*.xml 2>&1 | head
      - name: Collect
        if: always()
        run: |
          mkdir -p shots-jvm-out
          cp vio-app/app/build/shots-jvm/*.png shots-jvm-out/ || true
          cp -r vio-app/app/build/reports/tests shots-jvm-out/test-report || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vio-shots-jvm, path: shots-jvm-out }
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          mkdir -p vio-app/shots-jvm && cp shots-jvm-out/*.png vio-app/shots-jvm/ || true
          git add -f vio-app/shots-jvm
          git commit -m "JVM screenshots" || echo none
          git pull --rebase -X theirs origin ${{ github.ref_name }} && git push
