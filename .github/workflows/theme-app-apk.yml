name: Build Theme Master APK
on:
  push:
    paths: ['theme-app/**', '.github/workflows/theme-app-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build release APK
        working-directory: theme-app
        run: gradle assembleRelease --no-daemon
      - name: Collect APK
        run: cp theme-app/app/build/outputs/apk/release/app-release.apk ThemeMaster.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThemeMaster-apk
          path: ThemeMaster.apk
      - name: Publish downloadable release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete theme-latest --yes --cleanup-tag || true
          gh release create theme-latest ThemeMaster.apk \
            --target "${{ github.sha }}" \
            --title "صانع الثيمات — أحدث نسخة" \
            --notes "ملف APK جاهز للتثبيت (أندرويد 7.0 فما فوق). فعّل «التثبيت من مصادر غير معروفة» ثم ثبّته. Commit: ${{ github.sha }}"
